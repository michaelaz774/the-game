<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0e1a" />
    <title>RBC AI Grand Prix</title>

    <!-- Boot splash: inline so it paints the instant the HTML arrives, before
         the JS/CSS bundle finishes downloading. Prevents the white screen on
         slow wifi. React's <Loading> replaces #root once the bundle mounts. -->
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body {
        background:
          radial-gradient(1200px 600px at 50% -10%, #1b243f 0%, transparent 60%),
          linear-gradient(180deg, #11182b 0%, #0a0e1a 100%);
        background-color: #0a0e1a;
        overflow: hidden;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 32px;
        text-align: center;
        font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
        color: #f5f7fb;
      }
      #boot-splash .boot-tyre {
        width: 84px;
        height: 84px;
        border-radius: 50%;
        border: 10px solid #1a2036;
        border-top-color: #e10600;
        box-shadow: inset 0 0 0 6px #05070d, 0 12px 40px rgba(0, 0, 0, 0.45);
        animation: boot-spin 0.9s linear infinite;
      }
      #boot-splash .boot-title {
        margin: 6px 0 0;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: 0.06em;
      }
      #boot-splash .boot-sub {
        margin: 0;
        font-size: 13px;
        letter-spacing: 0.22em;
        color: #9aa6c0;
        text-transform: uppercase;
      }
      #boot-splash .boot-bar {
        position: relative;
        width: min(280px, 80%);
        height: 10px;
        border-radius: 999px;
        background: #1a2036;
        overflow: hidden;
        box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.6);
      }
      #boot-splash .boot-bar::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 40%;
        border-radius: 999px;
        background: linear-gradient(90deg, #0046ad, #e10600);
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-slide {
        0%   { left: -40%; }
        100% { left: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash">
        <div class="boot-tyre"></div>
        <h1 class="boot-title">RBC AI GRAND PRIX</h1>
        <p class="boot-sub">WARMING UP THE GRID…</p>
        <div class="boot-bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
